# Runs the full test suite on every push and pull request.
#
# GitHub starts a throwaway Postgres just for this run and deletes it
# afterwards. CR_TEST_DATABASE_URL points only at that container: this
# workflow never sees, and must never be given, the main Supabase URL.

name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: farmnex
          POSTGRES_PASSWORD: farmnex
          POSTGRES_DB: crop_rescue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U farmnex -d crop_rescue_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      CR_TEST_DATABASE_URL: postgresql+psycopg://farmnex:farmnex@localhost:5432/crop_rescue_test
      CR_ENABLE_SCHEDULER: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (including DB tests against the throwaway Postgres)
        run: pytest -q -rs

      - name: Run doctests in crop_rescue/core
        run: pytest -q --doctest-modules crop_rescue/core -p no:cacheprovider
