# Local Postgres for tests only. Production uses Supabase.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: farmnex
      POSTGRES_PASSWORD: farmnex
      POSTGRES_DB: crop_rescue_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farmnex -d crop_rescue_test"]
      interval: 2s
      timeout: 3s
      retries: 20
